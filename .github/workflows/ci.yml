name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ---------- Fast layer: unit tests + lint on full Python matrix ----------
  # Runs on every PR push. Excludes property, slow, and live_api tests.
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check src tests

      - name: Test imports
        run: python -c "import src, src.cli; print('src package and CLI import successfully')"

      - name: Run fast unit tests
        run: |
          python -m pytest tests/ \
            --ignore=tests/integration \
            --no-cov \
            -q \
            -m "not property and not slow and not live_api"

  # ---------- Property lane: Hypothesis tests with full example budget -----
  # Runs on push to main and on-demand. Does not block PR pushes.
  property:
    runs-on: ubuntu-latest
    needs: unit
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"

      - name: Run property-based tests
        env:
          HYPOTHESIS_PROFILE: ci
        run: |
          python -m pytest tests/ \
            --ignore=tests/integration \
            --no-cov \
            -q \
            -m property

  # ---------- Slow layer: integration + smoke on single Python version -----
  integration:
    runs-on: ubuntu-latest
    needs: unit

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"

      - name: Run integration tests (excluding live_api)
        run: |
          python -m pytest tests/integration/ \
            --no-cov \
            -v \
            -m "not live_api"

      - name: Verify CLI loads
        run: pdf2manim --help
