[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-to-manim-pipeline"
version = "0.1.0"
description = "Convert PDFs to Manim animations using AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Parth", email = "f20240726@pilani.bits-pilani.ac.in"}
]
keywords = ["manim", "animation", "pdf", "ai", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "manim>=0.17.0",
    "pydantic>=2.0.0",
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "click>=8.0.0",
    "PyMuPDF>=1.23.0",
    "Pillow>=10.0.0",
    "jsonschema>=4.19.0",
    "python-dateutil>=2.8.2",
    "aiofiles>=23.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.82.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.6.0",
]
engine_reference = [
    "manimgl>=1.7.2",
]

[project.scripts]
pdf2manim = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
src = ["py.typed"]

[tool.pytest.ini_options]
minversion = "7.0"
# Default ("fast") lane: skip property + live_api tests so the sweep is reliably
# under 3 minutes and never hangs. Run them explicitly:
#   pytest tests/test_determinism.py tests/test_persistence_agent.py \
#          tests/test_animation_generator.py tests/test_validation_agent.py \
#          tests/test_json_sanitizer.py tests/test_scene_controller.py -m property
#   pytest -m live_api                                       # real-API smoke
# IMPORTANT: invoke the property lane with explicit file paths, not
# `pytest -m property tests/`. Collecting all 549 tests just to filter to 8
# triggers cross-file import-time pollution that hangs the run.
# Coverage is opt-in (pass --cov=src) — leaving it on by default makes ad-hoc
# iteration slow without adding signal.
addopts = "-v --strict-markers --tb=short -m 'not property and not live_api'"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
markers = [
    "unit: Unit tests for specific components",
    "integration: Integration tests for end-to-end workflows",
    "property: Property-based tests using Hypothesis (excluded from fast PR lane)",
    "slow: Tests that take significant time to run",
    "live_api: Tests that require real external provider credentials or network access",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.uv]